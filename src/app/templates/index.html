{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
  <h1>Your personal task list</h1>

  {% if current_user.is_authenticated %}
    <a class="button" href="{{ url_for('tasks.dashboard') }}">Open my tasks</a>
  {% else %}
    <p>Create an account to keep your tasks in one place.</p>
    <a class="button" href="{{ url_for('auth.register') }}">Create an account</a>
  {% endif %}
{% endblock %}
